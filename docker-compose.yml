# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ceremonia
      POSTGRES_USER: ceremonia
      POSTGRES_PASSWORD: ceremonia_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

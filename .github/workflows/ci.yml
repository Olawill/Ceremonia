name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ceremonia:ceremonia_dev@localhost:5437/ceremonia
      NEXT_PUBLIC_ROOT_DOMAIN: ceremonia.app
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_WEBHOOK_SIGNING_SECRET: placeholder
      RESEND_API_KEY: placeholder
      BLOB_READ_WRITE_TOKEN: placeholder
      UNSPLASH_ACCESS_KEY: placeholder
      PIXABAY_API_KEY: placeholder
      NEXT_PUBLIC_EVENT_THEME: royal
      POLAR_ACCESS_TOKEN: placeholder
      POLAR_WEBHOOK_SECRET: placeholder
      POLAR_SERVER: sandbox
      NEXT_PUBLIC_POLAR_PRODUCT_STARTER_MONTHLY: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_STARTER_ONCE: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_PRO_MONTHLY: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_AGENCY_MONTHLY: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_ROOMS_CREDITS: prod_placeholder
      NEXT_PUBLIC_POSTHOG_KEY: phc_placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ceremonia
          POSTGRES_USER: ceremonia
          POSTGRES_PASSWORD: ceremonia_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run test:unit -- --coverage

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration
    env:
      # Database — spun up as a service, matches docker-compose credentials
      DATABASE_URL: postgresql://ceremonia:ceremonia_dev@localhost:5437/ceremonia
      # Real secrets
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET_TEST }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_TEST }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN_TEST || 'vercel_blob_placeholder' }}

      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /app/dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /app/dashboard
      # Public config
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ROOT_DOMAIN: ceremonia.app
      NEXT_PUBLIC_EVENT_THEME: royal
      NEXT_PUBLIC_POSTHOG_KEY: phc_placeholder
      NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
      # Optional — placeholders pass Zod validation
      UNSPLASH_ACCESS_KEY: placeholder
      PIXABAY_API_KEY: placeholder
      # Polar product IDs
      POLAR_ACCESS_TOKEN: placeholder
      POLAR_WEBHOOK_SECRET: placeholder
      POLAR_SERVER: sandbox
      NEXT_PUBLIC_POLAR_PRODUCT_STARTER_MONTHLY: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_STARTER_ONCE: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_PRO_MONTHLY: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_AGENCY_MONTHLY: prod_placeholder
      NEXT_PUBLIC_POLAR_PRODUCT_ROOMS_CREDITS: prod_placeholder
      # Playwright
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test+clerk_test@ceremonia.app' }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      PLAYWRIGHT_DEMO_SLUG: demo
      # Suppress Next.js telemetry prompt in build output
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ceremonia
          POSTGRES_USER: ceremonia
          POSTGRES_PASSWORD: ceremonia_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lockb') }}-${{ hashFiles('**/*.ts','**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - run: bun run build
      - run: bunx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
